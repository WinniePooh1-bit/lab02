name: render k6 summary captures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-k6-captures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render captures from the saved raw k6 summaries
        run: python scripts/render-summary-captures.py

      - name: Check generated captures
        run: |
          set -euo pipefail
          for name in summary-05vu summary-30vu summary-100vu summary-threshold-pass summary-threshold-fail; do
            test -s "screenshots/$name.png"
            python -c "from PIL import Image; im=Image.open('screenshots/$name.png'); im.verify()"
          done

      - name: Commit and push screenshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "test: publish readable k6 summary screenshots"
            git push origin HEAD:main
          else
            echo "Summary captures are already up to date."
          fi
